<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' ws: wss: http://localhost:* http://127.0.0.1:* https://api.example.com https://*.googleapis.com https://*.ngrok-free.dev https://*.ngrok-free.app https://*.ngrok.io; frame-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <title>MyPeople | GmailWeaver</title>
    <script type="module" src="/src/main-minimal.js"></script>
    <link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <style>
      .site_title_text {
        font-size: 1.2rem; font-weight: 700; color: #fff;
        letter-spacing: 0.5px; text-decoration: none;
        display: flex; align-items: center; gap: 8px;
      }
      .site_title_text i { font-size: 1.3rem; color: #26B99A; }

      body, html { overflow: hidden; }
      .left_col, .nav_title { display: none !important; }
      .nav.toggle { display: none !important; }
      footer { display: none !important; }

      /* top_nav: fixed, full-width, on top */
      .top_nav {
        position: fixed !important;
        top: 0 !important; left: 0 !important; right: 0 !important;
        width: 100% !important; margin: 0 !important; z-index: 1000 !important;
      }

      /* right_col: fixed, starts exactly at bottom of navbar */
      .right_col {
        position: fixed !important;
        top: 57px !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
        background: linear-gradient(145deg, #e8f5f0 0%, #f0f7ff 50%, #f5f0ff 100%);
        margin: 0 !important; padding: 0 !important; overflow: hidden !important;
      }

      /* ── 페이지 레이아웃 ── */
      .right_col > div:first-child { padding-top: 0; }
      .mp-page {
        position: fixed !important;
        top: 57px !important;
        left: 0 !important; right: 0 !important;
        bottom: 100px !important;
        padding: 16px 90px 0 90px !important;
        display: flex !important; flex-direction: column !important;
        gap: 10px !important; box-sizing: border-box !important;
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }

      /* ── 콘텐츠 행 (왼쪽+오른쪽 패널) ── */
      .mp-content {
        flex: 1; min-height: 0;
        display: flex; flex-direction: row;
        gap: 20px;
        overflow: visible;
      }

      /* ── 왼쪽 컬럼 (사람 패널) ── */
      .mp-left {
        flex: 1; min-width: 0;
        display: flex; flex-direction: column;
      }

      /* ── 오른쪽 컬럼 래퍼 + 번호탭 ── */
      .mp-right-wrap {
        flex: 2; min-width: 0;
        position: relative;
        display: flex; flex-direction: column;
        /* 순위 바/동기화 타일 글자 크기가 이 컬럼의 실제 너비 기준으로 반응하도록 */
        container-type: inline-size;
      }
      .mp-right-numbtns {
        position: absolute; top: -36px; right: 0;
        display: flex; align-items: flex-end;
        gap: 4px;
      }
      .mp-right-numbtn {
        width: 34px; height: 28px;
        border: none; cursor: pointer;
        font-size: clamp(0.75rem, 1.6cqw, 0.9rem); font-weight: 900;
        border-radius: 8px 8px 0 0;
        color: rgba(255,255,255,0.45);
        transition: color 0.15s, height 0.15s;
      }
      .mp-right-numbtn.n1 { background: #52c9a4; }
      .mp-right-numbtn.n2 { background: #6b9df7; }
      .mp-right-numbtn.n3 { background: #9b75e0; }
      .mp-right-numbtn.active { color: #fff; height: 36px; }

      /* ── 오른쪽 컬럼 (패널) ── */
      .mp-right {
        flex: 1; min-width: 0; min-height: 0;
        background: #52c9a4;
        border: 2.5px solid #52c9a4;
        border-radius: 20px;
        box-shadow: 0 4px 18px rgba(82,201,164,0.22);
        padding: 16px 14px;
        display: flex; flex-direction: column; overflow: hidden;
        transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
      }
      .mp-right.tab2 { background: #6b9df7; border-color: #6b9df7; box-shadow: 0 4px 18px rgba(107,157,247,0.28); }
      .mp-right.tab3 { background: #9b75e0; border-color: #9b75e0; box-shadow: 0 4px 18px rgba(155,117,224,0.28); }
      .mp-right-title {
        font-size: clamp(0.76rem, 1.6cqw, 0.9rem); font-weight: 700; color: rgba(255,255,255,0.92);
        margin-bottom: 10px; flex-shrink: 0; letter-spacing: -0.01em;
        text-shadow: 0 1px 3px rgba(0,0,0,0.15);
      }
      .mp-right-card {
        flex: 1; overflow-y: auto;
        background: #fff;
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 14px;
        padding: 12px 10px;
      }

      /* ── 탭 패널 공통 ── */
      .mp-rpanel { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }

      /* ── 순위 바 리스트 ── */
      .mp-rp-row {
        display: grid; grid-template-columns: 24px 1fr auto;
        align-items: center; gap: 7px; margin-bottom: 9px;
      }
      .mp-rp-rank { font-size: clamp(0.64rem, 1.3cqw, 0.74rem); font-weight: 800; color: #adb5bd; text-align: center; }
      .mp-rp-bar-wrap { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .mp-rp-name {
        font-size: clamp(0.62rem, 1.3cqw, 0.72rem); font-weight: 700; color: #2d3a4b;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .mp-rp-track { background: #f0f4f0; border-radius: 20px; height: 6px; overflow: hidden; }
      .mp-rp-fill {
        height: 100%; border-radius: 20px; width: 0;
        transition: width 0.8s cubic-bezier(0.22,1,0.36,1);
      }
      .mp-rp-fill.aff      { background: linear-gradient(90deg,#26B99A,#1affcc); }
      .mp-rp-fill.received { background: linear-gradient(90deg,#5a94e8,#8ab6f4); }
      .mp-rp-fill.sent     { background: linear-gradient(90deg,#74c69d,#40916c); }
      .mp-rp-count { font-size: clamp(0.62rem, 1.3cqw, 0.72rem); font-weight: 800; color: #40916c; text-align: right; white-space: nowrap; }

      /* ── 동기화 타일 (탭3) ── */
      .mp-sync-tiles {
        display: flex; flex-direction: column;
        gap: 6px; flex: 1; height: 100%;
      }
      .mp-sync-tile {
        flex: 1;
        border-radius: 10px; padding: 0 14px;
        color: #fff; display: flex; align-items: center; gap: 10px;
        min-height: 0;
      }
      .mp-sync-icon { font-size: clamp(1rem, 2.1cqw, 1.2rem); flex-shrink: 0; }
      .mp-sync-num { font-size: clamp(0.85rem, 1.8cqw, 1rem); font-weight: 900; flex: 1; }
      .mp-sync-lbl { font-size: clamp(0.52rem, 1.05cqw, 0.6rem); font-weight: 700; opacity: 0.82; text-transform: uppercase; letter-spacing: 0.4px; }
      #mp-global-wc {
        display: flex; flex-wrap: wrap;
        align-items: flex-start; align-content: flex-start;
        gap: 7px 10px;
      }

      /* ── 그리드 패널 ── */
      .mp-panel {
        width: 100%;
        background: rgba(255,255,255,0.72);
        border: 1.5px solid rgba(200,230,215,0.8);
        border-radius: 20px;
        backdrop-filter: blur(12px);
        box-shadow: 0 4px 28px rgba(38,185,154,0.1),
                    inset 0 1px 0 rgba(255,255,255,0.9);
        flex: 1; min-height: 0;
        padding: 8px 14px;
        overflow-y: auto;
        -webkit-mask-image: -webkit-radial-gradient(circle, #fff 100%, #000 100%);
        mask-image: radial-gradient(circle, #fff 100%, #000 100%);
        /* 카드 그리드 안의 글자 크기(아바타 이니셜/이름/배지)가 이 패널의 실제 너비
           기준으로 반응하도록 컨테이너로 지정 */
        container-type: inline-size;
      }
      .mp-panel::-webkit-scrollbar { width: 4px; }
      .mp-panel::-webkit-scrollbar-thumb { background: #b8ddd0; border-radius: 10px; }
      .mp-panel:has(.mp-detail.open) { overflow: hidden; }

      /* ── 패널 헤더 ── */
      .mp-panel-header {
        display: flex; align-items: center; flex-shrink: 0;
        width: 100%; gap: 20px;
      }
      .mp-header-left {
        flex: 1; display: flex; align-items: center;
        justify-content: space-between;
        /* 왼쪽 패널(.mp-panel)과 같은 너비를 가지므로, 이 헤더 영역 자체를 컨테이너로
           지정해 제목/드롭다운 등 텍스트가 실제 렌더링 폭 기준으로 반응하게 한다 */
        container-type: inline-size;
      }
      .mp-header-spacer { flex: 2; }
      .mp-title-wrap { display: flex; align-items: center; gap: 8px; }
      .mp-title{font-size:clamp(1.6rem, 8cqw, 2.6rem);font-weight:800;color:#1b2e22;letter-spacing:-.04em}
      .mp-title span{color:#1a9e6e}
      .mp-count {
        font-size: clamp(0.6rem, 1.6cqw, 0.72rem); color: #26B99A; font-weight: 700;
        background: rgba(38,185,154,0.12); padding: 2px 8px;
        border-radius: 20px;
      }
      /* ── 정렬 컨트롤 묶음(광고 제거 버튼 + 정렬 드롭다운) ── */
      .mp-header-controls { display: flex; align-items: center; gap: 8px; }
      .mp-brand-filter-btn {
        box-sizing: border-box; appearance: none; -webkit-appearance: none;
        font-family: inherit; line-height: inherit; margin: 0;
        display: flex; align-items: center; gap: 6px;
        background: rgba(255,255,255,0.8);
        border: 1.5px solid rgba(200,230,215,0.9);
        border-radius: 10px; padding: 6px 16px;
        cursor: pointer; font-size: clamp(0.68rem, 1.9cqw, 0.85rem); font-weight: 600;
        color: #2a3f35; backdrop-filter: blur(8px);
        transition: border-color 0.15s, background 0.15s, color 0.15s;
        white-space: nowrap; user-select: none;
        margin-top: 20px;
      }
      .mp-brand-filter-btn:hover { border-color: #26B99A; background: #fff; }
      .mp-brand-filter-btn.active {
        background: #26B99A; border-color: #26B99A; color: #fff;
        box-shadow: 0 4px 14px rgba(38,185,154,0.28);
      }

      /* ── 노션식 드롭다운 토글 ── */
      .mp-dropdown { position: relative; margin-top: 20px; }
      .mp-dropdown-btn {
        display: flex; align-items: center; justify-content: space-between;
        gap: 24px;
        background: rgba(255,255,255,0.8);
        border: 1.5px solid rgba(200,230,215,0.9);
        border-radius: 10px; padding: 6px 16px;
        cursor: pointer; font-size: clamp(0.68rem, 1.9cqw, 0.85rem); font-weight: 600;
        color: #2a3f35; backdrop-filter: blur(8px);
        transition: border-color 0.15s, background 0.15s;
        white-space: nowrap; user-select: none;
        min-width: 140px;
      }
      .mp-dropdown-btn:hover { border-color: #26B99A; background: #fff; }
      .mp-dropdown-btn.open { border-color: #26B99A; background: #fff; border-radius: 10px 10px 0 0; border-bottom-color: transparent; }
      .mp-dropdown-chevron {
        font-size: clamp(0.58rem, 1.6cqw, 0.7rem); color: #7aaa96;
        transition: transform 0.18s;
      }
      .mp-dropdown-btn.open .mp-dropdown-chevron { transform: rotate(180deg); }
      .mp-dropdown-menu {
        display: none; position: absolute; top: 100%; right: 0;
        min-width: 100%; background: #fff;
        border: 1.5px solid #26B99A; border-top: none;
        border-radius: 0 0 10px 10px;
        box-shadow: 0 8px 24px rgba(38,185,154,0.12);
        z-index: 500; overflow: hidden;
      }
      .mp-dropdown-menu.open { display: block; }
      .mp-dropdown-item {
        padding: 9px 16px; font-size: clamp(0.68rem, 1.9cqw, 0.84rem); font-weight: 500;
        color: #2a3f35; cursor: pointer;
        transition: background 0.12s;
        display: flex; align-items: center; gap: 8px;
      }
      .mp-dropdown-item:hover { background: #f0faf6; color: #26B99A; }
      .mp-dropdown-item.selected { color: #26B99A; font-weight: 700; }
      .mp-dropdown-item.selected::before {
        content: '✓'; font-size: 0.75rem; color: #26B99A;
      }
      .mp-dropdown-item:not(.selected)::before { content: ''; display: inline-block; width: 0.75rem; }

      .mp-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-auto-rows: auto;
        gap: 8px;
        align-items: start;
      }

      /* 카드 — 열 너비 기준 정사각형, 화면 비율에 따라 반응 */
      .mp-card {
        border-radius: 14px;
        aspect-ratio: 1 / 1;
        width: 100%;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 4px; cursor: pointer;
        transition: transform 0.22s cubic-bezier(0.22,1,0.36,1), box-shadow 0.22s;
        position: relative; overflow: hidden;
      }
      .mp-card::before {
        content: ''; position: absolute; top: -20%; right: -10%;
        width: 55%; height: 50%;
        background: rgba(255,255,255,0.18); border-radius: 50%;
        pointer-events: none;
      }
      .mp-card:hover { transform: translateY(-4px) scale(1.04); }

      /* 파스텔 팔레트 */
      .mp-card.c0 { background: linear-gradient(150deg,#a8e8d8,#72cbb5); box-shadow:0 3px 14px rgba(114,203,181,0.28); }
      .mp-card.c1 { background: linear-gradient(150deg,#b8d4f8,#8ab6f4); box-shadow:0 3px 14px rgba(138,182,244,0.28); }
      .mp-card.c2 { background: linear-gradient(150deg,#d0c0f8,#b8a4f4); box-shadow:0 3px 14px rgba(184,164,244,0.28); }
      .mp-card.c3 { background: linear-gradient(150deg,#fde4a8,#fbd080); box-shadow:0 3px 14px rgba(251,208,128,0.28); }
      .mp-card.c4 { background: linear-gradient(150deg,#fcc0d8,#f8a4c4); box-shadow:0 3px 14px rgba(248,164,196,0.28); }
      .mp-card.c5 { background: linear-gradient(150deg,#a4e8e4,#78d4d0); box-shadow:0 3px 14px rgba(120,212,208,0.28); }
      .mp-card.c6 { background: linear-gradient(150deg,#fed4a8,#fcbc80); box-shadow:0 3px 14px rgba(252,188,128,0.28); }
      .mp-card.c0:hover { box-shadow:0 12px 24px rgba(114,203,181,0.4); }
      .mp-card.c1:hover { box-shadow:0 12px 24px rgba(138,182,244,0.4); }
      .mp-card.c2:hover { box-shadow:0 12px 24px rgba(184,164,244,0.4); }
      .mp-card.c3:hover { box-shadow:0 12px 24px rgba(251,208,128,0.4); }
      .mp-card.c4:hover { box-shadow:0 12px 24px rgba(248,164,196,0.4); }
      .mp-card.c5:hover { box-shadow:0 12px 24px rgba(120,212,208,0.4); }
      .mp-card.c6:hover { box-shadow:0 12px 24px rgba(252,188,128,0.4); }

      /* 친밀도 기반 카드 색상 — 친밀도 값에 따라 초록 계열 채도/명도가 연속적으로 변하는 그라데이션 */
      .mp-card.ca-fade {
        background: linear-gradient(150deg, var(--ca-light), var(--ca-dark));
        box-shadow: 0 3px 14px var(--ca-shadow);
      }
      .mp-card.ca-fade:hover { box-shadow: 0 12px 24px var(--ca-shadow-hover); }

      .mp-avatar {
        width: 76%; height: auto; aspect-ratio: 1/1;
        max-width: clamp(100px, 11cqw, 148px); min-width: clamp(56px, 6cqw, 78px);
        border-radius: 50%;
        background: rgba(255,255,255,0.88);
        display: flex; align-items: center; justify-content: center;
        font-size: clamp(1.3rem, 4cqw, 2rem); font-weight: 800;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1); flex-shrink: 0;
        overflow: hidden;
      }
      .mp-name {
        font-size: clamp(1.1rem, 3cqw, 2.15rem); font-weight: 700;
        color: rgba(30,50,44,0.82);
        text-align: center; line-height: 1.25; word-break: keep-all;
      }
      .mp-email-hint {
        font-size: clamp(0.52rem, 0.9cqw, 0.62rem); font-weight: 500;
        color: rgba(30,50,44,0.42);
        text-align: center; line-height: 1;
        max-width: 90%; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap;
      }
      .mp-period-badge {
        position: absolute; top: 6px; right: 6px;
        font-size: clamp(0.62rem, 1.2cqw, 0.8rem); font-weight: 700;
        color: rgba(20,50,40,0.75);
        background: rgba(255,255,255,0.82);
        border-radius: 9px; padding: 3px 9px;
        letter-spacing: 0.01em; line-height: 1.6;
        pointer-events: none;
      }
      .mp-period-badge.sent  { color: #b91c1c; background: rgba(239,68,68,0.16); }
      .mp-period-badge.recv  { color: #1d4ed8; background: rgba(90,148,232,0.18); }
      .mp-empty {
        grid-column: 1 / -1; text-align: center;
        padding: 50px 0; color: #a0b8b0;
      }
      .mp-empty i { font-size: clamp(1.6rem, 5cqw, 2.5rem); display: block; margin-bottom: 10px; }

      /* ── 그래프 미니 래퍼 (오른쪽 패널 상단) ── */
      .mp-graph-mini-card {
        height: 120px !important; flex-shrink: 0 !important;
        padding: 0 !important; overflow: hidden;
        cursor: pointer;
        transition: box-shadow 0.15s, transform 0.15s;
      }
      .mp-graph-mini-card:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(38,185,154,0.2) !important; }

      /* ── 그래프 전체 패널 (왼쪽 패널 오버레이) ── */
      .mp-graph-panel {
        display: none;
        position: absolute; inset: 0; z-index: 8;
        background: #fff; border-radius: 16px;
        flex-direction: column; overflow: hidden;
        box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      }
      .mp-graph-panel.open { display: flex; }
      .mp-graph-panel-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 8px 14px; border-bottom: 1.5px solid #d4ece4;
        background: #f5faf8; flex-shrink: 0;
      }
      .mp-graph-panel-title {
        font-size: 0.85rem; font-weight: 700; color: #1a5a4a;
        display: flex; align-items: center; gap: 6px;
      }
      .mp-graph-close {
        display: flex; align-items: center; gap: 5px;
        padding: 5px 12px; border: 1.5px solid #c4dfd8;
        background: #fff; color: #1a5a4a;
        font-size: 0.78rem; font-weight: 600; cursor: pointer;
        border-radius: 8px; transition: background 0.12s;
      }
      .mp-graph-close:hover { background: #e8f4f0; }
      .mp-graph-iframe { flex: 1; border: none; width: 100%; min-height: 0; }

      /* ════════════════════════════════════
         사람 디테일 패널
      ════════════════════════════════════ */
      .mp-panel { position: relative; }

      .mp-detail {
        display: none;
        position: absolute; inset: 0;
        background: #f7fcfa;
        border-radius: 18px;
        overflow: hidden;
        flex-direction: column;
        animation: detailIn 0.28s cubic-bezier(0.22,1,0.36,1);
        z-index: 10;
        box-shadow: 0 24px 64px rgba(0,40,30,0.13), inset 0 1px 0 rgba(255,255,255,0.9);
        /* 뷰포트(vw)가 아니라 이 패널 자신의 실제 너비를 기준으로 내부 요소들이
           반응형으로 커지고 작아지도록 컨테이너 쿼리 컨텍스트로 지정 */
        container-type: inline-size;
      }
      .mp-detail.open { display: flex; }
      @keyframes detailIn {
        from { opacity: 0; transform: scale(0.96) translateY(6px); }
        to   { opacity: 1; transform: scale(1) translateY(0); }
      }

      /* 닫기 버튼 */
      .mp-detail-close {
        position: absolute; top: clamp(10px, 1.2cqw, 16px); right: clamp(12px, 1.4cqw, 18px); z-index: 20;
        width: clamp(28px, 2.2cqw, 34px); height: clamp(28px, 2.2cqw, 34px); border-radius: 50%;
        border: 1.5px solid rgba(200,225,215,0.7);
        background: rgba(255,255,255,0.85);
        backdrop-filter: blur(8px);
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        color: #9ab8ac; font-size: clamp(0.72rem, 0.85cqw, 0.9rem);
        transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.15s;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      }
      .mp-detail-close:hover { background: #fff; color: #0f3d2e; border-color: #26B99A; transform: scale(1.08); }

      /* 헤더 */
      .mp-detail-header {
        display: flex; align-items: center; justify-content: center; gap: clamp(14px, 2.2cqw, 30px);
        padding: 22px 80px 20px clamp(20px, 2.8cqw, 32px);
        /* flex-grow(1:3)로 나누면 탭마다 본문 콘텐츠가 달라 실제 분배된 높이가
           흔들려서 아바타(cqh 기반)까지 탭마다 크기가 달라졌다. height:25%로
           고정해 어떤 탭이 활성이든 헤더 높이가 항상 동일하게 한다. */
        flex: 0 0 auto; height: 25%; min-height: 0; overflow: hidden;
        container-type: size;
        background: linear-gradient(135deg, #ffffff 0%, #f2fbf7 55%, #edf4ff 100%);
        border-bottom: 1.5px solid rgba(38,185,154,0.12);
        position: relative;
      }
      .mp-detail-avatar {
        /* 헤더 세로 padding(22px+20px=42px)을 뺀 실제 가용 높이에 맞춰 아바타 크기를 정해서,
           헤더가 눌려도 아바타가 헤더 밖으로 삐져나오지 않고 그 안에서 줄어든다 */
        width: clamp(56px, calc(100cqh - 42px), 140px);
        height: clamp(56px, calc(100cqh - 42px), 140px);
        border-radius: 50%; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: clamp(1.2rem, calc((100cqh - 42px) * 0.32), 3.6rem); font-weight: 800;
        box-shadow: 0 10px 36px rgba(0,0,0,0.14), 0 0 0 4px rgba(255,255,255,0.9);
        overflow: hidden;
      }
      /* 브랜드 로고 이미지는 원본에 여백이 많아 확대해서 원을 꽉 채움 */
      .mp-avatar img.mp-brand-logo,
      .mp-detail-avatar img.mp-brand-logo {
        transform: scale(2.6);
      }

      /* 상대방 아바타 테두리를 감싸는 친밀도 원형 게이지.
         아바타 자체 크기는 나 아바타와 완전히 동일하게 유지하고(안쪽으로 줄이지 않음),
         링은 그 바깥에 후광처럼 얹어서 두 아바타의 크기·위치가 똑같이 보이게 한다. */
      .mp-detail-avatar-ring {
        position: relative; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center;
        width: calc(clamp(56px, calc(100cqh - 42px), 140px) + 26px);
        height: calc(clamp(56px, calc(100cqh - 42px), 140px) + 26px);
      }
      .mp-detail-avatar-ring-svg {
        position: absolute; inset: 0; width: 100%; height: 100%;
        transform: rotate(-90deg);  /* 12시 방향에서 시작해 시계방향으로 채움 */
      }
      /* 친밀도라는 게 한눈에 느껴지도록 초록 대신 핑크/하트 톤으로.
         그라데이션 + 은은한 외곽 글로우 + 드롭섀도 필터로 관을 깎아놓은 듯한
         볼록한 입체감(엠보싱)을 준다. */
      .mp-detail-avatar-ring-bg { fill: none; stroke: url(#mpRingTrackGrad); stroke-width: 6; }
      .mp-detail-avatar-ring-fill {
        fill: none; stroke: url(#mpRingFillGrad); stroke-width: 6; stroke-linecap: round;
        stroke-dasharray: 289.03;   /* 2 * PI * r(46) */
        stroke-dashoffset: 289.03;
        filter: url(#mpRingBevel);
        transition: stroke-dashoffset 0.9s cubic-bezier(0.22,1,0.36,1);
      }
      .mp-detail-avatar-ring-label {
        position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%);
        display: inline-flex; align-items: center; gap: 4px;
        font-size: clamp(0.58rem, calc((100cqh - 42px) * 0.09), 0.76rem); font-weight: 800; color: #fff;
        background: linear-gradient(150deg, #f472b6, #db2777);
        border: 1.5px solid rgba(255,255,255,0.6);
        padding: 3px 11px 3px 9px; border-radius: 999px;
        box-shadow: 0 5px 14px rgba(219,39,119,0.4), inset 0 1px 0 rgba(255,255,255,0.35);
        white-space: nowrap;
      }
      @keyframes mp-heartbeat {
        0%, 100% { transform: scale(1); }
        25% { transform: scale(1.22); }
        40% { transform: scale(1); }
        55% { transform: scale(1.14); }
        70% { transform: scale(1); }
      }
      .mp-detail-avatar-ring-label i {
        position: relative; top: 1.5px; color: #fff; font-size: 0.9em;
        filter: drop-shadow(0 1px 1px rgba(0,0,0,0.15));
        display: inline-block; animation: mp-heartbeat 1.8s ease-in-out infinite;
      }

      /* 나 아바타 + 관계 + 상대방 아바타 묶음 */
      .mp-detail-pair { display: flex; align-items: center; gap: clamp(6px, 1cqw, 14px); flex-shrink: 0; }
      /* 상대방 이름/이메일(오른쪽)과 데칼코마니 대칭이 되도록 오른쪽 정렬 */
      .mp-detail-self-info { text-align: right; }
      .mp-detail-relation {
        position: relative; display: flex; align-items: center; justify-content: center;
        width: clamp(56px, 7cqw, 96px); flex-shrink: 0;
      }
      .mp-detail-relation-line {
        position: absolute; left: 0; right: 0; top: 50%; height: 2px;
        transform: translateY(-50%); border-radius: 2px;
        background: linear-gradient(90deg, rgba(38,185,154,0.05), rgba(38,185,154,0.5), rgba(38,185,154,0.05));
      }
      .mp-detail-relation-label {
        position: relative; z-index: 2;
        display: inline-flex; align-items: center; gap: 6px;
        font-size: clamp(0.64rem, calc((100cqh - 42px) * 0.1), 0.88rem); font-weight: 700; color: #0f6e56;
        background: #fff; border: 1.5px solid rgba(38,185,154,0.4);
        padding: clamp(4px, calc((100cqh - 42px) * 0.06), 7px) clamp(8px, calc((100cqh - 42px) * 0.14), 16px);
        border-radius: 999px;
        box-shadow: 0 6px 16px rgba(38,185,154,0.18);
        white-space: nowrap;
      }
      .mp-detail-relation-label i { color: #26B99A; font-size: 0.85em; }
      .mp-detail-name {
        font-size: clamp(0.85rem, calc((100cqh - 42px) * 0.24), 2.1rem); font-weight: 800;
        background: linear-gradient(130deg, #0d3828 0%, #1a9e6e 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text;
        margin: 0 0 clamp(2px, calc((100cqh - 42px) * 0.05), 8px); line-height: 1.2;
      }
      .mp-detail-email { font-size: clamp(0.74rem, calc((100cqh - 42px) * 0.115), 1rem); color: #8aaa98; margin: 0; letter-spacing: 0.01em; }

      /* 탭 미니 버튼 그룹 (헤더 하단 경계선 바로 위 오른쪽) */
      .mp-detail-tab-group {
        position: absolute;
        bottom: clamp(6px, 1.2cqw, 10px); right: clamp(12px, 1.4cqw, 20px);
        z-index: 25;
        display: flex; gap: clamp(3px, 0.6cqw, 5px);
      }
      .mp-detail-tab-btn {
        box-sizing: border-box;
        padding: clamp(5px, 0.5cqw, 7px) clamp(12px, 1.4cqw, 18px);
        border-radius: 20px;
        border: none;
        cursor: pointer;
        font-size: clamp(0.66rem, 0.85cqw, 0.85rem); font-weight: 700;
        color: #fff; letter-spacing: 0.03em;
        text-align: center;
        transition: opacity 0.15s;
        white-space: nowrap;
        background: #5a94e8;
      }
      #mp-tab-stats { background: #67CEB8; }
      #mp-tab-desc  { background: #8CB4EF; }
      .mp-detail-tab-btn:hover { opacity: 0.82; }
      .mp-detail-tab-btn.active-stats {
        background: #67CEB8; box-shadow: 0 2px 10px rgba(103,206,184,0.45);
      }
      .mp-detail-tab-btn.active-desc {
        background: #8CB4EF; box-shadow: 0 2px 10px rgba(140,180,239,0.45);
      }
      .mp-detail-tab-btn.active-kw {
        background: #B99EE9; box-shadow: 0 2px 10px rgba(185,158,233,0.45);
      }
      #mp-tab-kw { background: #B99EE9; }
      .mp-detail-tab-btn:not(.active-stats):not(.active-desc):not(.active-kw) { opacity: 0.45; }

      /* 본문: 이메일 교환 하나만 남아 전체 폭을 사용. 헤더(아바타 영역)와 1:3 비율,
         내용이 그 안에 꽉 차게 들어가서 스크롤이 생기지 않게 한다. */
      .mp-detail-body {
        flex: 3; min-height: 0; overflow: hidden;
        display: grid; grid-template-columns: 1fr;
        background: linear-gradient(180deg, #f6fcf9 0%, #f0faf4 100%);
      }

      /* 키워드 탭 패널 */
      .mp-detail-kw {
        display: none; flex: 3; min-height: 0; overflow-y: auto;
        overscroll-behavior: contain;
        background: linear-gradient(160deg, rgba(232,220,255,0.35) 0%, rgba(248,244,255,0.2) 100%);
        padding: 14px clamp(20px, 3cqw, 48px) clamp(20px, 2.5cqw, 36px);
        flex-direction: column; gap: clamp(10px, 1.2cqw, 16px);
      }
      .mp-detail-kw.show { display: flex; }

      /* 설명 탭 패널 */
      .mp-detail-desc {
        display: none; flex: 3; min-height: 0; overflow-y: auto;
        overscroll-behavior: contain;
        background: linear-gradient(160deg, #f4f8ff 0%, #f0faf8 100%);
        padding: clamp(20px, 2.5cqw, 36px) clamp(20px, 3cqw, 48px);
        flex-direction: column;
      }
      .mp-detail-desc.show { display: flex; }
      #mp-desc-profile-content { display: flex; flex-direction: column; gap: 0; }
      .mp-desc-card {
        background: #fff; border-radius: 14px;
        padding: clamp(12px, 1.6cqw, 20px) clamp(14px, 2cqw, 24px);
        border: 1.5px solid #d8e4ff;
        display: flex; flex-direction: column; gap: 10px;
      }
      .mp-desc-card-title {
        font-size: clamp(0.68rem, 0.82cqw, 0.82rem); font-weight: 700;
        color: #2a4bb8; letter-spacing: 0.06em; text-transform: uppercase;
      }
      .mp-desc-stat-row {
        display: flex; gap: 10px;
      }
      .mp-desc-stat-box {
        flex: 1; background: #f5f8ff; border-radius: 10px;
        padding: 10px 12px; text-align: center;
        border: 1px solid #dce7ff;
      }
      .mp-desc-stat-num {
        font-size: clamp(1.1rem, 1.8cqw, 1.6rem); font-weight: 800; line-height: 1;
      }
      .mp-desc-stat-lbl {
        font-size: clamp(0.6rem, 0.7cqw, 0.7rem); color: #7a9ab8; margin-top: 4px; font-weight: 600;
      }
      .mp-desc-kw-list {
        display: flex; flex-wrap: wrap; gap: 6px 8px;
      }
      .mp-desc-kw {
        display: inline-block; border-radius: 20px;
        padding: 3px 10px; font-size: clamp(0.64rem, 0.76cqw, 0.78rem); font-weight: 700;
        background: #e8eeff; color: #3a5bcc;
      }
      .mp-desc-affinity-bar {
        height: 10px; border-radius: 10px;
        background: linear-gradient(90deg, #5a94e8, #8ab6f4);
        transition: width 0.8s cubic-bezier(0.22,1,0.36,1);
      }
      /* AI 프로필 설명 행 */
      .mp-desc-profile-row {
        display: flex; gap: 16px; align-items: flex-start;
        padding: 14px 0; border-bottom: 1px solid rgba(180,200,240,0.3);
      }
      .mp-desc-profile-row:last-child { border-bottom: none; }
      .mp-desc-profile-key {
        flex-shrink: 0; min-width: 120px;
        font-size: clamp(0.7rem, 0.82cqw, 0.82rem); font-weight: 700;
        color: #3a5bcc; background: linear-gradient(135deg,#eef1ff,#e6ecff);
        border-radius: 20px; padding: 4px 14px;
        letter-spacing: 0.03em; text-align: center;
        box-shadow: 0 1px 4px rgba(90,120,220,0.1);
      }
      .mp-desc-profile-val {
        font-size: clamp(0.78rem, 0.92cqw, 0.94rem); color: #1e2e42;
        line-height: 1.65; word-break: keep-all; padding-top: 3px;
      }
      .mp-desc-profile-empty {
        color: #b0c4d8; font-size: 0.86rem; font-style: italic;
        text-align: center; padding: 40px 0; width: 100%;
      }

      .mp-detail-col {
        padding: clamp(12px, 1.4cqw, 18px) clamp(10px, 1.2cqw, 16px);
        display: flex; flex-direction: column; gap: clamp(6px, 0.8cqw, 11px);
        min-width: 0; min-height: 0; overflow: hidden;
        background: linear-gradient(160deg, rgba(196,236,214,0.22) 0%, rgba(224,248,234,0.14) 100%);
      }

      /* 섹션 타이틀 — 필 태그 (글씨 길이만큼만) */
      .mp-detail-section-title {
        display: inline-flex; align-items: center;
        align-self: flex-start;
        background: rgba(38,185,154,0.13);
        border: 1.5px solid rgba(38,185,154,0.3);
        border-radius: 20px;
        padding: clamp(4px, 0.5cqw, 6px) clamp(10px, 1.2cqw, 16px);
        font-size: clamp(0.7rem, 0.85cqw, 0.86rem); font-weight: 700; color: #147a5c;
        letter-spacing: 0.05em; box-sizing: border-box;
        box-shadow: 0 1px 4px rgba(38,185,154,0.1);
      }
      .mp-detail-section-sub {
        font-size: clamp(0.62rem, 0.72cqw, 0.74rem); font-weight: 700;
        color: #26B99A; background: rgba(38,185,154,0.1);
        padding: 2px 8px; border-radius: 20px; letter-spacing: 0;
      }

      /* 세로 막대그래프 (이메일 교환) */
      .mp-vchart-wrap { display: flex; gap: 6px; min-height: 0; align-items: stretch; flex: 1 1 0; }
      .mp-vchart-y {
        display: flex; flex-direction: column; justify-content: space-between;
        /* padding-top: 연도 배지 행 높이만큼 띄워서 "최댓값" 라벨이 막대가 실제로
           100% 채워지는 지점(배지 아래)과 정확히 맞도록 함 */
        padding-top: 26px; padding-bottom: 34px; min-width: 28px; height: 100%; flex-shrink: 0;
      }
      .mp-vchart-y span { font-size: 0.92rem; color: #9a8e7f; text-align: right; line-height: 1; font-weight: 700; letter-spacing: 0.02em; }
      .mp-vchart-area {
        flex: 1; overflow-x: auto; height: 100%; min-height: 0;
        overscroll-behavior: contain;
        display: flex; align-items: flex-end;
        border-left: 1.5px solid rgba(28,28,30,0.14);
        border-bottom: 1.5px solid rgba(28,28,30,0.14);
        padding: 0;
        background: repeating-linear-gradient(
          180deg,
          transparent,
          transparent calc(100%/3 - 0.5px),
          rgba(28,28,30,0.035) calc(100%/3 - 0.5px),
          rgba(28,28,30,0.035) calc(100%/3)
        );
        border-radius: 0;
      }
      .mp-vchart-area::-webkit-scrollbar { height: 4px; }
      .mp-vchart-area::-webkit-scrollbar-thumb { background: rgba(28,28,30,0.25); border-radius: 3px; }
      .mp-vchart-area::-webkit-scrollbar-track { background: rgba(28,28,30,0.06); border-radius: 3px; }
      .mp-vchart-group {
        display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0;
        height: 100%;
        cursor: pointer; padding: 0 3px; border-radius: 4px;
        transition: background 0.15s;
      }
      .mp-vchart-group:hover { background: rgba(28,28,30,0.05); }
      .mp-vchart-group.active { background: rgba(38,185,154,0.14); }
      .mp-vchart-bars { display: flex; align-items: flex-end; gap: 4px; flex: 1; min-height: 0; }
      .mp-vchart-bar {
        width: 14px; border-radius: 2px 2px 0 0; min-height: 2px;
        transition: height 0.65s cubic-bezier(0.22,1,0.36,1), opacity 0.15s;
      }
      .mp-vchart-group:hover .mp-vchart-bar { opacity: 0.85; }
      .mp-vchart-bar.sent { background: linear-gradient(0deg, #12886e, #26B99A); }
      .mp-vchart-bar.recv { background: linear-gradient(0deg, #3a72d4, #6a9ef0); }
      .mp-vchart-label { display: flex; flex-direction: column; align-items: center; line-height: 1.2; gap: 2px; }
      .mp-vchart-month { font-size: 0.86rem; color: #8a8073; white-space: nowrap; font-weight: 700; }
      .mp-vchart-year {
        font-size: 0.7rem; font-weight: 700; white-space: nowrap;
        padding: 0; border-radius: 0; color: #a39a8d; background: transparent !important;
        letter-spacing: 0.03em; line-height: 1.3;
      }

      /* 이메일 목록 카드 (막대 클릭 시 오른쪽에 열리는 서랍) */
      .mp-email-card {
        background: #fff; border: 1px solid rgba(28,28,30,0.08); border-left-width: 3px;
        border-radius: 4px; padding: 14px 16px;
        display: flex; flex-direction: column; gap: 6px;
        transition: border-color 0.15s, box-shadow 0.15s; flex-shrink: 0;
        text-decoration: none; color: inherit; cursor: pointer;
      }
      .mp-email-card.sent { border-left-color: #12886e; }
      .mp-email-card.received { border-left-color: #5a94e8; }
      .mp-email-card:hover { border-color: rgba(38,185,154,0.5); box-shadow: 0 4px 16px rgba(28,28,30,0.06); }
      .mp-email-card-top { display: flex; align-items: center; justify-content: space-between; }
      .mp-email-tag {
        font-size: 0.8rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
        padding: 3px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
      }
      .mp-email-tag.sent { background: rgba(38,185,154,0.12); color: #0f6e56; }
      .mp-email-tag.received { background: rgba(90,148,232,0.14); color: #2952a3; }
      .mp-email-date { font-size: 0.86rem; color: #8a8073; }
      .mp-email-subject { font-size: 1.12rem; font-weight: 700; color: #1c1c1e; line-height: 1.4; }
      .mp-email-snippet { font-size: 0.96rem; color: #6b6459; line-height: 1.5; }
      .mp-email-from { font-size: 0.82rem; color: #a39a8d; }

      /* 워드 클라우드 */
      .mp-wc-wrap {
        flex: 1; min-height: 0;
        display: flex; flex-wrap: wrap; align-items: flex-start; align-content: flex-start;
        justify-content: center; gap: 8px 12px; padding: 14px 10px;
        background: linear-gradient(145deg, rgba(255,255,255,0.85) 0%, rgba(242,238,255,0.5) 100%);
        border: 1px solid rgba(180,160,240,0.25);
        border-radius: 14px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .mp-wc-wrap::-webkit-scrollbar { width: 4px; }
      .mp-wc-wrap::-webkit-scrollbar-thumb { background: rgba(160,140,220,0.35); border-radius: 4px; }
      .mp-wc-wrap::-webkit-scrollbar-track { background: transparent; }
      .mp-wc-word {
        display: inline-block; font-weight: 800; line-height: 1.25;
        cursor: default; border-radius: 8px; padding: 3px 6px;
        opacity: 0; transform: scale(0.6) translateY(4px);
        transition: transform 0.22s cubic-bezier(0.22,1,0.36,1), opacity 0.22s ease;
      }
      .mp-wc-word.show { opacity: 1; transform: scale(1) translateY(0); }
      .mp-wc-word:hover { transform: scale(1.18) translateY(-2px) !important; z-index: 10; position: relative; filter: brightness(1.1); }
      .mp-wc-count {
        font-size: 0.6em; font-weight: 700; margin-left: 2px;
        vertical-align: super; opacity: 0.5;
      }

      /* ════════════════════════════════════
         타임라인 패널
      ════════════════════════════════════ */
      .mp-timeline {
        position: fixed; bottom: 12px;
        left: 40px; right: 40px;
        height: 88px;
        background: none;
        border: none;
        box-shadow: none;
        z-index: 200;
        padding: 10px 28px 12px;
        display: flex; flex-direction: column; gap: 6px;
        container-type: inline-size;
      }

    <script>
      /* ── 사용자 처리 ── */
      (function () {
        const p = new URLSearchParams(window.location.search);
        const n = p.get('name') ? decodeURIComponent(p.get('name')) : (sessionStorage.getItem('gw_user_name') || '-');
        if (p.get('name')) sessionStorage.setItem('gw_user_name', n);
        if (p.get('gmail_id')) localStorage.setItem('gw_gmail_id', decodeURIComponent(p.get('gmail_id')));
        const el = document.getElementById('google-profile-name');
        if (el) el.textContent = n;
      })();

      /* ── 같은 name을 가진 브랜드 엔트리 통합 (친밀도 높은 대표 1개만 유지) ── */
      function groupByEntityName(list) {
        const seen = new Map();
        list.forEach(p => {
          const key = (p.email || '').toLowerCase().trim();
          if (!key) return;
          if (!seen.has(key)) seen.set(key, p);
        });
        return [...seen.values()];
      }

      /* ── 이름 길이별 폰트 크기 ── */
      function nameFontSize(name) {
        const len = (name || '').length;
        const isKorean = /[가-힣]/.test(name || '');
        if (isKorean) {
          if (len <= 4)  return 'clamp(0.9rem, 1.7cqw, 1.7rem)';
          if (len <= 6)  return 'clamp(0.82rem, 1.4cqw, 1.4rem)';
          if (len <= 9)  return 'clamp(0.72rem, 1.2cqw, 1.2rem)';
          if (len <= 15) return 'clamp(0.6rem,  1.0cqw, 1.0rem)';
          return             'clamp(0.5rem,  0.82cqw, 0.88rem)';
        }
        /* 영문/숫자는 글자 폭이 한글보다 좁으므로 같은 길이 구간이어도 더 크게 하되,
           최댓값(가장 짧은 구간)은 한글 3~4글자 구간 크기를 넘지 않도록 캡 */
        if (len <= 5)  return 'clamp(0.88rem, 1.68cqw, 1.68rem)';
        if (len <= 8)  return 'clamp(0.8rem,  1.43cqw, 1.43rem)';
        if (len <= 12) return 'clamp(0.7rem,  1.2cqw,  1.2rem)';
        if (len <= 18) return 'clamp(0.58rem, 0.97cqw, 0.97rem)';
        return             'clamp(0.48rem, 0.8cqw,  0.85rem)';
      }

      /* ── 발신 전용/브랜드 계정 판별 (표시 이름 추론 + 아바타 생성 대상 판별 공용) ──
         로컬파트 정확히 일치 목록만으로는 stories-recap@, graph-insights@, recommendations@
         같은 변형을 못 거르므로, 키워드 포함 매칭 + 브랜드 표시명 차단목록을 함께 사용한다. */
      const GENERIC_LOCAL_KEYWORDS = ['noreply','no-reply','no.reply','donotreply','info','support','admin',
        'hello','contact','mail','newsletter','update','service','team','automated','mailer',
        'postmaster','alert','recap','recommend','suggestion','insight','security','comment',
        'digest','marketing','promo','bot','notification'];

      const BRAND_DISPLAY_NAMES = new Set([
        'instagram','pinterest','google','google play','mcafee','twitter','x','discord',
        'microsoft','xbox','neo4j','the neo4j team','facebook','linkedin','naver','kakao',
        'amazon','apple','netflix','youtube','spotify','slack','zoom','adobe','dropbox',
        'paypal','ebay','samsung','lg','steam','playstation','nintendo','airbnb','uber',
        'github','figma','notion',
      ]);

      function isGenericLocalPart(local) {
        const l = (local || '').toLowerCase();
        return GENERIC_LOCAL_KEYWORDS.some(k => l.includes(k));
      }
      function isBrandDisplayName(name) {
        return BRAND_DISPLAY_NAMES.has((name || '').trim().toLowerCase());
      }

      /* ── 브랜드 로고 이미지의 실제 여백을 캔버스로 분석해, 원을 정확히 채우는 배율을 계산 ── */
      function autoFitBrandLogo(img) {
        try {
          const w = img.naturalWidth, h = img.naturalHeight;
          if (!w || !h) return;
          const cvs = document.createElement('canvas');
          cvs.width = w; cvs.height = h;
          const ctx = cvs.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const data = ctx.getImageData(0, 0, w, h).data;
          const bgR = data[0], bgG = data[1], bgB = data[2], bgA = data[3];
          const THRESH = 18;
          let minX = w, minY = h, maxX = 0, maxY = 0, found = false;
          for (let y = 0; y < h; y += 2) {
            for (let x = 0; x < w; x += 2) {
              const i = (y * w + x) * 4;
              const a = data[i + 3];
              if (a < 10) continue; // 완전 투명 = 배경
              const dr = data[i] - bgR, dg = data[i + 1] - bgG, db = data[i + 2] - bgB, da = a - bgA;
              if (Math.sqrt(dr * dr + dg * dg + db * db + da * da) > THRESH) {
                found = true;
                if (x < minX) minX = x; if (x > maxX) maxX = x;
                if (y < minY) minY = y; if (y > maxY) maxY = y;
              }
            }
          }
          if (!found) return;
          const fracW = (maxX - minX) / w, fracH = (maxY - minY) / h;
          const frac = Math.min(fracW, fracH);
          if (frac <= 0) return;
          const scale = Math.max(1, Math.min(1 / frac, 3.4));
          img.style.transform = `scale(${scale.toFixed(2)})`;
        } catch (e) {
          /* CORS 등으로 픽셀 분석 불가 시 CSS 기본 확대값 유지 */
        }
      }
      function setupBrandLogo(img) {
        if (!img) return;
        if (img.complete && img.naturalWidth) autoFitBrandLogo(img);
        else img.addEventListener('load', () => autoFitBrandLogo(img), { once: true });
      }
      /* 발신 전용/브랜드 계정인지 (이름 필드를 사람 이름으로 신뢰할 수 없는 경우) */
      function isBrandSender(p) {
        if (!p.email) return false;
        const [local] = p.email.split('@');
        return isGenericLocalPart(local) || isBrandDisplayName(p.name);
      }

      /* ── 이메일에서 표시 이름 추론 ── */
      function resolveDisplayName(p) {
        if (!p.email) return (p.name && p.name.trim()) ? p.name.trim() : '(알 수 없음)';
        const [local, domain] = p.email.split('@');
        // 발신 전용/브랜드 계정은 이름 필드 무시 → 도메인 브랜드명 사용
        if (isBrandSender(p)) {
          const parts = (domain || '').split('.');
          // mail.instagram.com → instagram, accounts.google.com → google
          return parts.length >= 3 ? parts[parts.length - 2] : parts[0];
        }
        // 일반 계정: 이름 있으면 이름, 없으면 @ 앞부분
        if (p.name && p.name.trim()) return p.name.trim();
        return local || '(알 수 없음)';
      }

      /* ── 친밀도 기반 카드 색상 ── 하나의 초록 색조(hue)를 고정하고, 친밀도가 높을수록
         채도·명도를 진하게 만들어 "친밀도가 낮으면 흐린 민트, 높으면 짙은 에메랄드"로
         자연스럽게 이어지는 그라데이션을 만든다(구간별 다른 색이 아니라 연속값). */
      const AFFINITY_HUE = 158;  // 친밀도: 초록 계열

      /* 지정한 색조(hue)에 채도/명도 값을 직접 넣어 카드 그라데이션·그림자·글자색을 만드는 공용 함수.
         밝은 쪽/어두운 쪽에 색조를 살짝 다르게 줘서(단색 명암 대비가 아니라) 더 입체적이고
         디자인된 느낌의 그라데이션이 되도록 한다. */
      function tierColor(hue, sat, lightHi, lightLo) {
        const hueLight = hue + 9;   // 밝은 쪽은 살짝 따뜻하게
        const hueDark = hue - 7;    // 어두운 쪽은 살짝 청록/차갑게
        const textSat = Math.min(sat + 20, 85);
        const textLight = Math.max(lightLo - 26, 10);
        const shadowSat = Math.min(sat + 10, 70);
        const shadowLight = Math.max(lightLo - 14, 22);
        const shadowAlpha = 0.14 + (sat / 100) * 0.16;
        return {
          light: `hsl(${hueLight} ${sat}% ${lightHi}%)`,
          dark: `hsl(${hueDark} ${sat}% ${lightLo}%)`,
          gradient: `linear-gradient(150deg, hsl(${hueLight} ${sat}% ${lightHi}%), hsl(${hueDark} ${sat}% ${lightLo}%))`,
          shadow: `hsl(${hueDark} ${shadowSat}% ${shadowLight}% / ${shadowAlpha.toFixed(2)})`,
          shadowHover: `hsl(${hueDark} ${shadowSat}% ${shadowLight}% / ${(shadowAlpha + 0.16).toFixed(2)})`,
          text: `hsl(${hueDark} ${textSat}% ${textLight}%)`,
        };
      }

      // 기존 5단계 친밀도 구간(90%/70%/40%/15%/그 이하)을 유지하되, 구간마다 채도·명도를
      // 큰 폭으로 떨어뜨려 인접한 구간끼리도(예: 90%대 vs 70%대) 확실히 구분되게 한다.
      const AFFINITY_TIERS = [
        { min: 0.90, sat: 75, lightHi: 57, lightLo: 41 },   // 90%+: 선명한 에메랄드
        { min: 0.70, sat: 55, lightHi: 77, lightLo: 61 },   // 70~90%: 채도를 크게 낮춘 중간 톤
        { min: 0.40, sat: 35, lightHi: 87, lightLo: 75 },   // 40~70%: 옅은 파스텔
        { min: 0.15, sat: 23, lightHi: 94, lightLo: 86 },   // 15~40%: 아주 옅은 민트
        { min: -Infinity, sat: 7, lightHi: 98, lightLo: 93 }, // 15% 미만: 거의 흰색
      ];
      function affinityColor(aff) {
        const raw = aff ?? -1;
        const tier = AFFINITY_TIERS.find(tr => raw >= tr.min);
        return tierColor(AFFINITY_HUE, tier.sat, tier.lightHi, tier.lightLo);
      }

      /* ── 이니셜 ── */
      function initials(name) {
        const t = (name || '').trim();
        if (!t) return '?';
        if (/[가-힣]/.test(t[0])) return t[0];
        return t.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
      }

      /* ── 날짜 유틸 ── */
      function dateToMs(str) { return new Date(str).getTime(); }
      function fmtDate(ms) {
        const d = new Date(ms);
        return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
      }
      function fmtShort(ms) {
        const d = new Date(ms);
        const m = d.getMonth() + 1;
        return m === 1 ? `${d.getFullYear()}` : `${d.getFullYear()}.${String(m).padStart(2,'0')}`;
      }


      /* ── 전역 상태 ── */
      let allPeople = [];
      let globalFirst = 0, globalLast = 0; // ms
      let selMin = 0, selMax = 0;          // ms (현재 선택 구간)
      let fullMin = 0, fullMax = 0;        // ms (전체 기간, 슬라이더 무관)
      let activeFilter = 'all';
      let periodStats = {};       // email → {sent, received}
      let periodStatsLoaded = false;
      let statsDebounceTimer = null;
      let contactPhotos = {};     // email → photo URL
      let generatedAvatars = {};  // email → GPT 생성 아바타 이미지 URL
      let avatarGenStarted = false;
      let sortMode = 'affinity';
      let hideBrandAccounts = false;  // true면 기업/광고성 발신자 카드를 목록에서 숨김
      let sentStatsMap = {};      // email → 보낸 메일수
      let receivedStatsMap = {};  // email → 받은 메일수
      let currentDetailPerson = null;  // 현재 열린 상세보기 person 객체
      let detailDebounceTimer = null;
      let myAvatarUrl = null;  // 로그인한 사용자 본인의 아바타 이미지 URL (페이지 로드 시 1회 생성/캐시)

      async function fetchSentStats() {
        const gmailId = localStorage.getItem('gw_gmail_id') || '';
        try {
          const res = await fetch('/mail-person-sent-stats', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ gmail_id: gmailId, start_date: msToDateStr(selMin), end_date: msToDateStr(selMax) })
          });
          if (res.ok) {
            const j = await res.json();
            sentStatsMap = {};
            (j.data || []).forEach(item => { sentStatsMap[(item.email||'').toLowerCase()] = item.sent || 0; });
          }
        } catch(e) { console.error('fetchSentStats 오류:', e); }
      }

      async function fetchReceivedStats() {
        const gmailId = localStorage.getItem('gw_gmail_id') || '';
        try {
          const res = await fetch('/mail-person-received-stats', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ gmail_id: gmailId, start_date: msToDateStr(selMin), end_date: msToDateStr(selMax) })
          });
          if (res.ok) {
            const j = await res.json();
            receivedStatsMap = {};
            (j.data || []).forEach(item => { receivedStatsMap[(item.email||'').toLowerCase()] = item.received || 0; });
          }
        } catch(e) { console.error('fetchReceivedStats 오류:', e); }
      }

      async function fetchPeriodStats() {
        const gmailId = localStorage.getItem('gw_gmail_id') || '';
        if (!gmailId) return;
        const post = body => ({
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(body)
        });
        const body = {
          gmail_id: gmailId,
          start_date: msToDateStr(selMin),
          end_date: msToDateStr(selMax)
        };
        try {
          const [sRes, rRes] = await Promise.all([
            fetch('/mail-person-sent-stats',     post(body)),
            fetch('/mail-person-received-stats', post(body))
          ]);
          const newStats = {};
          if (sRes.ok) {
            const j = await sRes.json();
            (j.data || j).forEach(item => {
              const e = (item.email || '').toLowerCase();
              newStats[e] = newStats[e] || {sent: 0, received: 0};
              newStats[e].sent = item.sent || 0;
            });
          }
          if (rRes.ok) {
            const j = await rRes.json();
            (j.data || j).forEach(item => {
              const e = (item.email || '').toLowerCase();
              newStats[e] = newStats[e] || {sent: 0, received: 0};
              newStats[e].received = item.received || 0;
            });
          }
          periodStats = newStats;
          periodStatsLoaded = true;
          console.log('[periodStats] loaded. keys:', Object.keys(newStats).length, newStats);
          renderCards();
        } catch (e) { console.error('fetchPeriodStats 오류:', e); }
      }

      function updateCardBadges() {
        document.querySelectorAll('.mp-card').forEach(card => {
          const ps = periodStats[(card.dataset.email || '').toLowerCase()] || {};
          const total = (ps.sent || 0) + (ps.received || 0);
          let badge = card.querySelector('.mp-period-badge');
          if (total > 0) {
            if (!badge) {
              badge = document.createElement('div');
              badge.className = 'mp-period-badge';
              card.appendChild(badge);
            }
            badge.textContent = total + '건';
          } else if (badge) {
            badge.remove();
          }
        });
      }

      /* ── 카드 렌더링 ── */
      function renderCards() {
        const grid = document.getElementById('mp-grid');
        let list = groupByEntityName(allPeople);
        console.log('[renderCards] loaded:', periodStatsLoaded, 'before filter:', list.length, 'periodStats keys:', Object.keys(periodStats).length);
        if (hideBrandAccounts) {
          list = list.filter(p => !isBrandSender(p));
        }
        if (periodStatsLoaded) {
          list = list.filter(p => {
            const ps = periodStats[(p.email || '').toLowerCase()];
            return ps && (ps.sent || 0) + (ps.received || 0) > 0;
          });
        }
        // 정렬
        if (sortMode === 'affinity') {
          list.sort((a, b) => (b.affinity || 0) - (a.affinity || 0));
        } else if (sortMode === 'name') {
          list.sort((a, b) => resolveDisplayName(a).localeCompare(resolveDisplayName(b), 'ko'));
        } else if (sortMode === 'total') {
          list.sort((a, b) => {
            const ea = (a.email||'').toLowerCase(), eb = (b.email||'').toLowerCase();
            return ((sentStatsMap[eb]||0) + (receivedStatsMap[eb]||0)) - ((sentStatsMap[ea]||0) + (receivedStatsMap[ea]||0));
          });
        } else if (sortMode === 'sent') {
          list.sort((a, b) => (sentStatsMap[(b.email||'').toLowerCase()] || 0) - (sentStatsMap[(a.email||'').toLowerCase()] || 0));
        } else if (sortMode === 'received') {
          list.sort((a, b) => (receivedStatsMap[(b.email||'').toLowerCase()] || 0) - (receivedStatsMap[(a.email||'').toLowerCase()] || 0));
        }
        const countEl = document.getElementById('mp-count');
        if (countEl) countEl.textContent = list.length ? `${list.length}명` : '';

        if (!list.length) {
          grid.innerHTML = `<div class="mp-empty"><i class="bi bi-people"></i><p>데이터를 불러오는 중...</p></div>`;
          return;
        }
        const COLS = 7;
        const COLORS = ['c0','c1','c2','c3','c4','c5','c6'];
        const AVATAR_COLORS = ['#0f7a62','#1d55c4','#5b21b6','#b45309','#9d174d','#0f766e','#c2410c'];
        const TEST_TIER_VALUES = [0.95, 0.80, 0.55, 0.25, 0.05];  // TEMP TEST
        const TEST_BLOCK_SIZE = Math.ceil(list.length / TEST_TIER_VALUES.length);  // TEMP TEST — 전체를 5구간으로 한 번만 나눠 순서대로 내려가게
        grid.innerHTML = list.map((p, i) => {
          const testAffinity = TEST_TIER_VALUES[Math.min(TEST_TIER_VALUES.length - 1, Math.floor(i / TEST_BLOCK_SIZE))];  // TEMP TEST — 이 줄을 지우고 아래 줄 주석을 해제하면 원래대로 복귀
          // const testAffinity = p.affinity;
          const ac = affinityColor(testAffinity);
          const cardVars = `--ca-light:${ac.light};--ca-dark:${ac.dark};--ca-shadow:${ac.shadow};--ca-shadow-hover:${ac.shadowHover};`;
          const displayName = resolveDisplayName(p);
          const ps = periodStats[(p.email || '').toLowerCase()] || {};
          const em = (p.email || '').toLowerCase();
          const total = (ps.sent || 0) + (ps.received || 0);
          const photo = generatedAvatars[em] || contactPhotos[em];
          const brandCls = isBrandSender(p) ? ' mp-brand-logo' : '';
          const avatarInner = photo
            ? `<img src="${photo}" alt="${displayName}" class="${brandCls.trim()}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;" onerror="this.parentElement.textContent='${initials(displayName)}'">`
            : initials(displayName);
          let badge = '';
          if (sortMode === 'affinity') {
            if (testAffinity != null) badge = `<div class="mp-period-badge">${Math.round(testAffinity * 100)}%</div>`;
          } else if (sortMode === 'name') {
            badge = '';
          } else if (sortMode === 'sent') {
            const cnt = sentStatsMap[em] || 0;
            if (cnt > 0) badge = `<div class="mp-period-badge sent">보낸 ${cnt}건</div>`;
          } else if (sortMode === 'received') {
            const cnt = receivedStatsMap[em] || 0;
            if (cnt > 0) badge = `<div class="mp-period-badge recv">받은 ${cnt}건</div>`;
          } else if (sortMode === 'total') {
            const totalCnt = (sentStatsMap[em] || 0) + (receivedStatsMap[em] || 0) || total;
            if (totalCnt > 0) badge = `<div class="mp-period-badge">${totalCnt}건</div>`;
          }
          return `
            <div class="mp-card ca-fade" style="${cardVars}" data-idx="${i}" data-name="${p.name || ''}" data-email="${p.email || ''}" title="${p.email || ''}">
              <div class="mp-avatar" style="color:${ac.text}">${avatarInner}</div>
              <div class="mp-name" style="font-size:${nameFontSize(displayName)}">${displayName}</div>
              ${badge}
            </div>`;
        }).join('');
        grid.querySelectorAll('.mp-avatar img.mp-brand-logo').forEach(setupBrandLogo);
      }

      /* ── 타임라인 초기화 ── */
      function initTimeline(firstMs, lastMs) {
        globalFirst = firstMs; globalLast = lastMs;
        fullMin = firstMs; fullMax = lastMs;
        selMin = firstMs; selMax = lastMs;

        const inMin = document.getElementById('tl-min');
        const inMax = document.getElementById('tl-max');
        const fill  = document.getElementById('tl-fill');

        document.getElementById('tl-start-lbl').textContent = fmtDate(firstMs);
        document.getElementById('tl-end-lbl').textContent   = fmtDate(lastMs);

        /* 눈금 생성 (약 6~8개) */
        buildTicks(firstMs, lastMs);

        function msToVal(ms) { return Math.round((ms - firstMs) / (lastMs - firstMs) * 1000); }
        function valToMs(v)  { return firstMs + (v / 1000) * (lastMs - firstMs); }

        function updateFill() {
          const minV = +inMin.value, maxV = +inMax.value;
          const lPct = minV / 10, rPct = maxV / 10;
          fill.style.left  = lPct + '%';
          fill.style.width = (rPct - lPct) + '%';
          selMin = valToMs(minV); selMax = valToMs(maxV);
          sentStatsMap = {}; receivedStatsMap = {};  // 날짜 범위 변경 시 캐시 무효화
          document.getElementById('tl-selected-text').textContent =
            `${fmtDate(selMin)} — ${fmtDate(selMax)}`;
          renderCards();
          clearTimeout(statsDebounceTimer);
          statsDebounceTimer = setTimeout(fetchPeriodStats, 120);
          // 상세보기가 열려 있으면 기간별 데이터도 갱신
          const detailEl = document.getElementById('mp-detail');
          if (currentDetailPerson && detailEl && detailEl.classList.contains('open')) {
            clearTimeout(detailDebounceTimer);
            detailDebounceTimer = setTimeout(() => refreshDetailStats(currentDetailPerson), 400);
          }
        }

        inMin.addEventListener('input', () => {
          if (+inMin.value >= +inMax.value) inMin.value = +inMax.value - 1;
          updateFill();
        });
        inMax.addEventListener('input', () => {
          if (+inMax.value <= +inMin.value) inMax.value = +inMin.value + 1;
          updateFill();
        });

        updateFill();
      }

      function buildTicks(firstMs, lastMs) {
        const ticks = document.getElementById('tl-ticks');
        ticks.innerHTML = '';
        const spanMs = lastMs - firstMs;
        const spanMonths = spanMs / (1000 * 60 * 60 * 24 * 30);

        /* 간격 결정: 3년 이상이면 반년, 그 미만이면 분기 */
        const stepMonths = spanMonths > 30 ? 6 : 3;

        const start = new Date(firstMs);
        const cur = new Date(start.getFullYear(), start.getMonth(), 1);

        const points = [];
        while (cur.getTime() <= lastMs) {
          points.push(cur.getTime());
          cur.setMonth(cur.getMonth() + stepMonths);
        }
        points.push(lastMs);

        const uniq = [...new Set([firstMs, ...points])].filter(t => t >= firstMs && t <= lastMs);

        uniq.forEach(t => {
          const pct = ((t - firstMs) / (lastMs - firstMs)) * 100;
          const div = document.createElement('div');
          div.className = 'mp-tl-tick';
          div.style.position = 'absolute';
          div.style.left = pct + '%';
          div.style.transform = 'translateX(-50%)';
          div.innerHTML = `<div class="mp-tl-tick-line"></div><span class="mp-tl-tick-lbl">${fmtShort(t)}</span>`;
          ticks.appendChild(div);
        });
      }

      /* ── 데이터 로드 ── */
      async function loadPeople() {
        const gmailId = localStorage.getItem('gw_gmail_id') || '';
        const post = body => ({
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({gmail_id: gmailId})
        });

        let dateRange = null;

        try {
          const [pRes, dRes, phRes, avRes] = await Promise.all([
            fetch('/high_affinity_person_stats', post()),
            fetch('/mail-date-range', post()),
            fetch('/contact-photos', post()),
            fetch('/person-avatars', post())
          ]);

          if (pRes.ok) {
            const j = await pRes.json();
            allPeople = j.data || j || [];
          } else {
            console.error('high_affinity_person_stats 오류:', pRes.status);
          }

          if (dRes.ok) {
            const j = await dRes.json();
            const d = j.data || j;
            if (d.first_date && d.last_date) dateRange = d;
          } else {
            console.error('mail-date-range 오류:', dRes.status);
          }

          if (phRes.ok) {
            contactPhotos = await phRes.json();
          }

          if (avRes.ok) {
            generatedAvatars = await avRes.json();
          }
        } catch (e) {
          console.error('loadPeople 네트워크 오류:', e);
        }

        renderCards();
        startAvatarGeneration();
        initMyAvatar();

        if (dateRange) {
          initTimeline(new Date(dateRange.first_date).getTime(), new Date(dateRange.last_date).getTime());
        } else {
          const fallbackEnd = Date.now();
          const fallbackStart = fallbackEnd - 1000 * 60 * 60 * 24 * 365 * 3;
          initTimeline(fallbackStart, fallbackEnd);
        }
      }

      /* ── 모든 사람/발신자에 대해 아바타 생성 (이미 생성된 사람은 서버에서 캐시로 건너뜀)
         실제 기업/브랜드 발신자인지는 서버에서 LLM으로 판별해 로고 이미지를, 그 외에는
         GPT 이미지 API로 일러스트 아바타를 생성한다. ── */
      async function startAvatarGeneration() {
        if (avatarGenStarted) return;
        avatarGenStarted = true;

        const gmailId = localStorage.getItem('gw_gmail_id') || '';
        if (!gmailId) return;

        const candidates = groupByEntityName(allPeople)
          .filter(p => p.email && !generatedAvatars[(p.email || '').toLowerCase()])
          .map(p => ({ email: p.email, name: resolveDisplayName(p) }));

        if (!candidates.length) return;

        const BATCH_SIZE = 6;
        for (let i = 0; i < candidates.length; i += BATCH_SIZE) {
          const batch = candidates.slice(i, i + BATCH_SIZE);
          try {
            const res = await fetch('/generate-person-avatars', {
              method: 'POST', headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ gmail_id: gmailId, people: batch })
            });
            if (res.ok) {
              const j = await res.json();
              Object.assign(generatedAvatars, j.data || {});
              renderCards();
            }
          } catch (e) {
            console.error('아바타 생성 오류:', e);
          }
        }
      }

      /* ── 로그인한 사용자 본인 아바타: 페이지 로드 시 1회 생성/캐시해두고,
         상세보기를 열 때마다 다시 만들 필요 없이 바로 꺼내 쓴다. ── */
      async function initMyAvatar() {
        const gmailId = localStorage.getItem('gw_gmail_id') || '';
        const myNameEl = document.getElementById('mp-detail-my-name');
        const myEmailEl = document.getElementById('mp-detail-my-email');
        if (myNameEl) myNameEl.textContent = sessionStorage.getItem('gw_user_name') || '나';
        if (myEmailEl) myEmailEl.textContent = gmailId || '이메일 정보 없음';
        if (!gmailId) return;
        try {
          const cacheRes = await fetch('/self-avatar', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ gmail_id: gmailId })
          });
          if (cacheRes.ok) {
            const j = await cacheRes.json();
            if (j.url) { myAvatarUrl = j.url; refreshSelfAvatarEl(); return; }
          }
          const myName = sessionStorage.getItem('gw_user_name') || '나';
          const genRes = await fetch('/generate-self-avatar', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ gmail_id: gmailId, name: myName })
          });
          if (genRes.ok) {
            const j = await genRes.json();
            if (j.url) { myAvatarUrl = j.url; refreshSelfAvatarEl(); }
          }
        } catch (e) {
          console.error('내 아바타 생성 오류:', e);
        }
      }

      /* 상세보기가 이미 열려 있는 상태에서 내 아바타가 뒤늦게 도착하면 화면에 반영 */
      function refreshSelfAvatarEl() {
        const el = document.getElementById('mp-detail-avatar-self');
        if (!el || !myAvatarUrl) return;
        el.innerHTML = `<img src="${myAvatarUrl}" alt="나" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      }

      /* ── 광고(기업 발신자) 제거 토글 ── */
      const brandFilterBtn = document.getElementById('mp-brand-filter-btn');
      const brandFilterLabel = document.getElementById('mp-brand-filter-label');
      brandFilterBtn.addEventListener('click', () => {
        hideBrandAccounts = !hideBrandAccounts;
        brandFilterBtn.classList.toggle('active', hideBrandAccounts);
        brandFilterLabel.textContent = hideBrandAccounts ? '광고 표시' : '광고 제거';
        renderCards();
      });

      /* ── 드롭다운 토글 ── */
      const ddBtn = document.getElementById('mp-dropdown-btn');
      const ddMenu = document.getElementById('mp-dropdown-menu');
      const ddLabel = document.getElementById('mp-dropdown-label');

      ddBtn.addEventListener('click', e => {
        e.stopPropagation();
        ddBtn.classList.toggle('open');
        ddMenu.classList.toggle('open');
      });

      ddMenu.addEventListener('click', async e => {
        const item = e.target.closest('.mp-dropdown-item');
        if (!item) return;
        document.querySelectorAll('.mp-dropdown-item').forEach(i => i.classList.remove('selected'));
        item.classList.add('selected');

      document.addEventListener('click', () => {
        ddBtn.classList.remove('open');
        ddMenu.classList.remove('open');
      });

      /* ── 디테일 패널 ── */
      const AVATAR_COLORS_DETAIL = ['#0f7a62','#1d55c4','#5b21b6','#b45309','#9d174d','#0f766e','#c2410c'];
      const CARD_BG = [
        'linear-gradient(150deg,#a8e8d8,#72cbb5)',
        'linear-gradient(150deg,#b8d4f8,#8ab6f4)',
        'linear-gradient(150deg,#d0c0f8,#b8a4f4)',
        'linear-gradient(150deg,#fde4a8,#fbd080)',
        'linear-gradient(150deg,#fcc0d8,#f8a4c4)',
        'linear-gradient(150deg,#a4e8e4,#78d4d0)',
        'linear-gradient(150deg,#fed4a8,#fcbc80)',
      ];
      const WC_COLORS = ['#0f7a62','#1d55c4','#9333ea','#b45309','#dc2626','#d97706','#0e7490','#1d4ed8','#be185d','#4338ca'];
      let kwCache = null;
      let descCache = null;

      function msToDateStr(ms) {
        return new Date(ms).toISOString().split('T')[0];
      }

      async function loadKeywords(gmailId) {
        if (kwCache) return kwCache;
        try {
          const res = await fetch('/keyword-stats', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({gmail_id: gmailId})
          });
          if (res.ok) {
            const j = await res.json();
            kwCache = (j.data || j).keywords || [];
          }
        } catch {}
        return kwCache || [];
      }

      async function loadDescriptions(gmailId) {
        if (descCache) return descCache;
        try {
          const res = await fetch('/person-descriptions', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({gmail_id: gmailId})
          });
          if (res.ok) {
            const j = await res.json();
            descCache = j.data || [];
          }
        } catch {}
